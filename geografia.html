<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Discovery Arcade 🌍</title>
    <style>
        :root {
            --color-principal: #10ac84;
            --bg-juego: #2f3542;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #00g2d3 0%, #a8ff78 100%);
            background: linear-gradient(135deg, #78e08f 0%, #60a3bc 100%);
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333;
            overflow-x: hidden;
        }

        .contenedor-principal {
            background: rgba(255, 255, 255, 0.96); padding: 25px; border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            max-width: 480px; width: 92%; text-align: center; box-sizing: border-box;
            position: relative;
        }

        h1 { color: #2f3542; margin: 10px 0; font-weight: 900; }

        .btn-volver { 
            background-color: #576574; color: white; border: none; padding: 8px 18px; border-radius: 50px; 
            cursor: pointer; margin-bottom: 15px; font-weight: bold; box-shadow: 0 3px 0 #2f3542;
        }
        .btn-volver:active { transform: translateY(2px); box-shadow: none; }

        /* --- MARCADOR DE PASAPORTE --- */
        .marcador {
            background: #f1f2f6; padding: 12px; border-radius: 20px; margin-bottom: 20px; 
            border: 3px dashed var(--color-principal); font-weight: bold; font-size: 18px; color: #10ac84;
        }

        /* --- PANTALLA DE PREGUNTA --- */
        .pantalla-pregunta {
            background: var(--bg-juego); color: white; border-radius: 25px; padding: 20px; margin: 15px 0;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.3);
        }

        .pista-visual { font-size: 70px; margin: 10px 0; animation: flotar 3s ease-in-out infinite; }

        /* --- BOTONES OPCIONES --- */
        .btn-geo {
            background: linear-gradient(45deg, #48dbfb, #1dd1a1); color: white; border: none; 
            padding: 15px; font-size: 17px; font-weight: bold; border-radius: 20px; cursor: pointer;
            width: 100%; margin-bottom: 12px; border-bottom: 5px solid #10ac84; transition: transform 0.1s;
            text-align: center;
        }
        .btn-geo:hover { filter: brightness(1.05); transform: scale(1.01); }
        .btn-geo:active { transform: translateY(4px); border-bottom-width: 1px; }

        .feedback { font-size: 19px; font-weight: bold; min-height: 35px; margin-top: 15px; }

        @keyframes flotar {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .animar-exito { animation: sacudir 0.5s ease-in-out; }
        @keyframes sacudir {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="contenedor-principal" id="bloque-modulo">
        <button class="btn-volver" onclick="window.location.href='index.html'">🔙 Ir al Mapa</button>
        <h1>🌍 Geo-Discovery Arcade ✈️</h1>

        <div class="marcador">
            <span>🛂 Sellos en el Pasaporte: <span id="sellos-contador">0</span> 🛃</span>
        </div>

        <div class="pantalla-pregunta">
            <div id="geo-emoji" class="pista-visual">✈️</div>
            <h2 id="geo-pregunta" style="font-size: 20px; margin: 0;">¿A qué país pertenece esta bandera?</h2>
        </div>

        <div id="geo-opciones"></div>
        <div id="geo-feedback" class="feedback"></div>
    </div>

    <script>
        // --- EFECTOS DE SONIDO SYNTH NATIVOS ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sonido(tipo) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (tipo === 'vuelo') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (tipo === 'sello') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (tipo === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- BANCO DE PREGUNTAS GEOGRÁFICAS ---
        const retosGeo = [
            { q: "¿A qué país pertenece esta bandera?", e: "🇲🇽", r: "México", f: ["España", "Colombia"] },
            { q: "¿Cuál es la famosa capital de Francia, conocida por la Torre Eiffel?", e: "🗼", r: "París", f: ["Roma", "Londres"] },
            { q: "¿A qué país corresponden la pizza, el coliseo y esta bandera?", e: "🇮🇹", r: "Italia", f: ["Portugal", "Grecia"] },
            { q: "¿En qué país se encuentran las gigantescas y antiguas Pirámides?", e: "🐫", r: "Egipto", f: ["China", "Brasil"] },
            { q: "¿Cuál es la capital de España?", e: "🇪🇸", r: "Madrid", f: ["Barcelona", "Sevilla"] },
            { q: "¿A qué país pertenece esta bandera donde viven los koalas y canguros?", e: "🇦🇺", r: "Australia", f: ["Canadá", "Japón"] },
            { q: "¿Qué país es famoso por su Gran Muralla gigante que se ve desde el espacio?", e: "🐉", r: "China", f: ["India", "Rusia"] }
        ];

        let sellos = parseInt(localStorage.getItem('sellos_geo_v1')) || 0;
        document.getElementById('sellos-contador').innerText = sellos;

        let retoActual = null;

        function cargarNuevaMision() {
            document.getElementById('geo-feedback').innerText = "";
            
            // Elegir una pregunta aleatoria que no sea exactamente la misma si es posible
            let nuevoReto;
            do {
                nuevoReto = retosGeo[Math.floor(Math.random() * retosGeo.length)];
            } while (nuevoReto === retoActual && retosGeo.length > 1);
            
            retoActual = nuevoReto;

            // Inyectar datos
            document.getElementById('geo-pregunta').innerText = retoActual.q;
            document.getElementById('geo-emoji').innerText = retoActual.e;

            // Mezclar opciones
            let opciones = [retoActual.r, ...retoActual.f].sort(() => 0.5 - Math.random());
            
            let contOpciones = document.getElementById('geo-opciones');
            contOpciones.innerHTML = "";

            opciones.forEach(op => {
                let b = document.createElement('button');
                b.className = "btn-geo";
                b.innerText = op;
                b.onclick = () => verificarRespuesta(op);
                contOpciones.appendChild(b);
            });
        }

        function verificarRespuesta(seleccion) {
            let feed = document.getElementById('geo-feedback');
            // Bloquear clics mientras muestra el resultado
            document.querySelectorAll('.btn-geo').forEach(b => b.style.pointerEvents = 'none');

            if (seleccion === retoActual.r) {
                sonido('sello');
                sellos += 1;
                localStorage.setItem('sellos_geo_v1', sellos);
                document.getElementById('sellos-contador').innerText = sellos;
                
                feed.innerText = "🛫 ¡Buen vuelo! ¡Pasaporte sellado! 🎫";
                feed.style.color = "#1dd1a1";
                document.getElementById('bloque-modulo').classList.add('animar-exito');

                setTimeout(() => {
                    document.getElementById('bloque-modulo').classList.remove('animar-exito');
                    sonido('vuelo');
                    cargarNuevaMision();
                }, 1800);
            } else {
                sonido('error');
                feed.innerText = "❌ ¡Avión desviado! Intenta otra ruta.";
                feed.style.color = "#ff4757";

                setTimeout(() => {
                    document.querySelectorAll('.btn-geo').forEach(b => b.style.pointerEvents = 'auto');
                    feed.innerText = "";
                }, 1500);
            }
        }

        // Arrancar el juego inmediatamente
        cargarNuevaMision();
    </script>
</body>
</html>
