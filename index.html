<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Math | Danna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <header>
            <h1>Dojo Matemático</h1>
            <div class="hud">
                <span>Nivel: <b id="level">1</b></span>
                <span>Vidas: <b id="lives">3</b></span>
            </div>
        </header>

        <section id="game-card">
            <h2 id="question">Cargando...</h2>
            <input type="number" id="answer" placeholder="Respuesta" inputmode="numeric">
            <button onclick="checkAnswer()">Confirmar</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
