<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Bienvenidos al Juego!</title>
    <style>
        /* --- ESTILOS Y ANIMACIONES (CSS) --- */
        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Para que los emojis flotantes no creen barras de scroll */
            position: relative;
        }

        .contenedor-inicio {
            text-align: center;
            z-index: 10; /* Por encima de los emojis flotantes */
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px);
        }

        /* Animación para el título (bota suavemente) */
        h1 {
            font-size: 40px;
            color: #ff4757;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: flotar 3s ease-in-out infinite;
        }

        p {
            font-size: 20px;
            color: #576574;
            margin-bottom: 30px;
        }

        /* El Súper Botón de Jugar con animación de pulso */
        .btn-jugar {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
            animation: pulso 2s infinite;
        }

        .btn-jugar:hover {
            transform: scale(1.1) rotate(2deg);
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            box-shadow: 0 12px 20px rgba(255, 71, 87, 0.6);
        }

        /* --- DEFINICIÓN DE ANIMACIONES --- */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulso {
            0% { transform: scale(1); box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 25px rgba(255, 71, 87, 0.6); }
            100% { transform: scale(1); box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4); }
        }

        /* Emojis flotantes de fondo */
        .emoji-decorativo {
            position: absolute;
            font-size: 35px;
            bottom: -50px;
            opacity: 0.7;
            animation: subirYRotar 8s linear infinite;
        }

        @keyframes subirYRotar {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="sonido-click" src="click.mp3"></audio>
    <audio id="sonido-intro" src="intro.mp3" autoplay loop></audio>

    <div class="contenedor-inicio">
        <h1>✨ ¡Súper Aventuras! ✨</h1>
        <p>¿Estás lista para el reto?</p>
        
        <button class="btn-jugar" onclick="comenzarJuego()">🎮 ¡JUGAR!</button>
    </div>

    <script>
        const emojis = ['🔢', '✍️', '👾', '🚀', '⭐', '🎈', '🧠', '📚'];

        function crearEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji-decorativo');
            
            // Elegir emoji aleatorio
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Posición horizontal aleatoria y velocidad aleatoria
            emoji.style.left = Math.random() * 100 + "vw";
            emoji.style.animationDuration = (Math.random() * 4 + 6) + "s"; // entre 6 y 10 segundos
            
            document.body.appendChild(emoji);

            // Borrar el emoji cuando termine la animación para que no sature la PC
            setTimeout(() => {
                emoji.remove();
            }, 10000);
        }

        // Crear un emoji cada 800 milisegundos
        setInterval(crearEmoji, 800);

        // Función para cambiar de página con sonido
        function comenzarJuego() {
            const sonido = document.getElementById('sonido-click');
            
            // Reproducir sonido de clic
            sonido.play();

            // Esperar 400 milisegundos para que se escuche el sonido antes de cambiar de página
            setTimeout(() => {
                window.location.href = "menuprincipal.html";
            }, 400);
        }
    </script>
</body>
</html>
