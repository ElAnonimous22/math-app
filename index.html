<!DOCTYPE html>
<html lang="es">
<head>
   <div id="game-container">
    <div class="stats">
        <div>Record: <span id="high-score">0</span></div>
        <div>Vidas: <span id="lives">❤️❤️❤️</span></div>
    </div>
    
    <div id="question-box">
        <h1 id="question">Cargando...</h1>
        <input type="number" id="answer" placeholder="Respuesta" autofocus>
        <button id="submit-btn" onclick="checkAnswer()">Enviar</button>
    </div>

    <div id="result-overlay" class="hidden">
        <h2 id="msg">Game Over</h2>
        <button onclick="resetGame()">Jugar de nuevo</button>
    </div>
</div>
></script>
</body>
</html>
