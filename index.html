<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Bienvenidos al Juego!</title>
    <style>
        /* --- DISEÑO AVANZADO Y GRADIENTE INTERACTIVO --- */
        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradienteDinamico 15s ease infinite;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        @keyframes gradienteDinamico {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- BOTÓN OTRAS APPS (NUEVO) --- */
        .contenedor-navegacion {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 30;
        }

        .btn-otras-apps {
            background: rgba(255, 255, 255, 0.85);
            color: #ff4757;
            border: 2px solid #ff6b81;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            backdrop-filter: blur(5px);
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.15);
            transition: all 0.2s ease;
        }

        .btn-otras-apps:hover {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
        }

        /* --- CONTENEDOR EFECTO CRISTAL DE ALTA CALIDAD --- */
        .contenedor-inicio {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 45px 50px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 71, 87, 0.15), 
                        0 1px 2px rgba(255, 255, 255, 0.8) inset;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            transform: scale(1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .contenedor-inicio:hover {
            transform: scale(1.02);
        }

        /* --- TIPOGRAFÍAS ARCADE CON REBOTE --- */
        h1 {
            font-size: 46px;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 10px 0;
            font-weight: 900;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.06));
            animation: flotar 3s ease-in-out infinite;
        }

        p {
            font-size: 22px;
            color: #576574;
            margin: 0 0 35px 0;
            font-weight: bold;
        }

        /* --- EL SÚPER BOTÓN DE JUGAR 3D --- */
        .btn-jugar {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 22px 60px;
            font-size: 34px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 0 #cf3a47, 0 15px 25px rgba(255, 71, 87, 0.4);
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulso 2.5s infinite;
        }

        .btn-jugar:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 #cf3a47, 0 20px 30px rgba(255, 71, 87, 0.5);
            filter: brightness(1.05);
        }

        .btn-jugar:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #cf3a47, 0 5px 10px rgba(255, 71, 87, 0.4);
        }

        /* --- ÁREA EXCLUSIVA DE PADRES --- */
        .zona-padres {
            position: absolute;
            bottom: 25px;
            z-index: 20;
        }

        .btn-padres {
            background: rgba(255, 255, 255, 0.7);
            color: #576574;
            border: 1px solid rgba(0,0,0,0.05);
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .btn-padres:hover {
            background: #2f3542;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        /* --- PANTALLA SEGURIDAD INTERNA (MODAL) --- */
        .modal-padres {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(47, 53, 66, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-padres.activo {
            opacity: 1; pointer-events: auto;
        }

        .caja-seguridad {
            background: #ffffff; padding: 30px; border-radius: 30px;
            max-width: 320px; width: 85%; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 3px solid #576574;
        }

        .caja-seguridad h3 { color: #2f3542; margin-top: 0; font-size: 22px; }
        .caja-seguridad p { font-size: 14px; margin-bottom: 15px; color: #747d8c; }

        .input-pin {
            width: 80%; padding: 12px; font-size: 24px; text-align: center;
            letter-spacing: 6px; border: 2px solid #ced6e0; border-radius: 15px;
            margin-bottom: 20px; outline: none; font-family: monospace;
            background: #f1f2f6; color: #2f3542;
        }

        .caja-botones-modal { display: flex; gap: 10px; justify-content: center; }

        .btn-modal {
            padding: 12px 24px; font-size: 16px; font-weight: bold; border: none;
            border-radius: 15px; cursor: pointer; transition: transform 0.1s;
        }
        .btn-confirmar { background: #1dd1a1; color: white; }
        .btn-cancelar { background: #ee5253; color: white; }
        .btn-modal:active { transform: scale(0.95); }

        /* --- ANIMACIONES --- */
        @keyframes flotar {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        @keyframes pulso {
            0%, 100% { filter: drop-shadow(0 0 0px rgba(255,71,87,0)); }
            50% { filter: drop-shadow(0 0 15px rgba(255,71,87,0.6)); }
        }

        .animar-error { animation: vibrar 0.4s ease-in-out; border-color: #ee5253 !important; }
        @keyframes vibrar {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .emoji-decorativo {
            position: absolute;
            bottom: -60px;
            opacity: 0;
            pointer-events: none;
            animation: subirYRotar var(--tiempo-caida) linear infinite;
        }

        @keyframes subirYRotar {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-115vh) translateX(var(--desvio-x)) rotate(var(--rotacion-final)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="contenedor-navegacion">
        <a href="https://elanonimous22.github.io/juegos-de-mesa/" class="btn-otras-apps" onclick="sonarClickEfecto()">🚀 Otras Apps</a>
    </div>

    <div class="contenedor-inicio">
        <h1>✨ ¡Súper Aventuras! ✨</h1>
        <p>¿Estás lista para el reto?</p>
        <button class="btn-jugar" onclick="comenzarJuego()">🎮 ¡JUGAR!</button>
    </div>

    <div class="zona-padres">
        <button class="btn-padres" onclick="abrirFiltroPadres()">🔐 Zona de Padres</button>
    </div>

    <div id="modal-seguridad" class="modal-padres">
        <div class="caja-seguridad" id="caja-alerta">
            <h3>🔒 Filtro de Adultos</h3>
            <p>Introduce la clave de acceso para continuar:</p>
            <input type="password" id="campo-pin" class="input-pin" maxlength="6" placeholder="******" inputmode="numeric">
            <div class="caja-botones-modal">
                <button class="btn-modal btn-cancelar" onclick="cerrarFiltroPadres()">Cancelar</button>
                <button class="btn-modal btn-confirmar" onclick="validarPinPadres()">Entrar</button>
            </div>
        </div>
    </div>

    <script>
        // --- MOTOR DE AUDIO SINTETIZADO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicaFondo = null;

        function iniciarMusicaFondo() {
            if (musicaFondo) return;
            const notas = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
            let i = 0;
            setInterval(() => {
                if (audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notas[i], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                i = (i + 1) % notas.length;
            }, 450);
            musicaFondo = true;
        }

        function sonarClickEfecto(tipo = 'clic') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            iniciarMusicaFondo();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (tipo === 'clic') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            } else if (tipo === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if (tipo === 'granted') {
                osc.type = 'square'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }

        // --- PARTÍCULAS ---
        const emojis = ['🔢', '✍️', '👾', '🚀', '⭐', '🎈', '🧠', '📚', '🎨', '🧩', '🐱'];
        function crearEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji-decorativo');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 95 + "vw";
            emoji.style.fontSize = (Math.random() * 20 + 25) + "px";
            emoji.style.setProperty('--tiempo-caida', (Math.random() * 3 + 5) + "s");
            emoji.style.setProperty('--desvio-x', (Math.random() * 80 - 40) + "px");
            emoji.style.setProperty('--rotacion-final', (Math.random() * 360 - 180) + "deg");
            document.body.appendChild(emoji);
            setTimeout(() => { emoji.remove(); }, 8000);
        }
        setInterval(crearEmoji, 600);
        window.onclick = () => { iniciarMusicaFondo(); };

        // --- MANEJO DEL MODAL Y FILTRO ---
        function abrirFiltroPadres() {
            sonarClickEfecto();
            document.getElementById('campo-pin').value = "";
            document.getElementById('modal-seguridad').classList.add('activo');
            setTimeout(() => document.getElementById('campo-pin').focus(), 100);
        }

        function cerrarFiltroPadres() {
            sonarClickEfecto('error');
            document.getElementById('modal-seguridad').classList.remove('activo');
        }

        function validarPinPadres() {
            const input = document.getElementById('campo-pin').value;
            const caja = document.getElementById('caja-alerta');
            
            if (input === "010822") {
                sonarClickEfecto('granted');
                setTimeout(() => {
                    window.location.href = "padres.html";
                }, 400);
            } else {
                sonarClickEfecto('error');
                caja.classList.add('animar-error');
                document.getElementById('campo-pin').value = "";
                setTimeout(() => {
                    caja.classList.remove('animar-error');
                }, 400);
            }
        }

        // Permitir pulsar Enter en el teclado
        document.getElementById('campo-pin').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validarPinPadres();
        });

        function comenzarJuego() {
            sonarClickEfecto();
            setTimeout(() => {
                window.location.href = "menuprincipal.html";
            }, 350);
        }
    </script>
</body>
</html>
