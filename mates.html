<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Matemáticas</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .contenedor-principal {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        h1, h2 { color: #2f3542; margin-top: 0; }
        .subtitulo { color: #576574; margin-bottom: 25px; font-size: 18px; }
        .oculto { display: none !important; }

        /* --- BOTONES --- */
        .btn {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
        }
        .btn:hover { transform: scale(1.03); background-color: #3742fa; }
        .btn:active { transform: scale(0.98); }

        .btn-volver {
            background-color: #576574;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn-volver:hover { background-color: #2f3542; }

        .btn-borrar {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            opacity: 0.7;
        }
        .btn-borrar:hover { opacity: 1; }

        /* --- MENÚ DE SELECCIÓN DE JUEGOS --- */
        .lista-juegos { display: flex; flex-direction: column; gap: 15px; }
        .tarjeta-juego {
            background-color: #f1f2f6;
            border: 3px solid transparent;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        .tarjeta-juego:hover {
            transform: translateY(-3px);
            background-color: #ffffff;
            border-color: #1e90ff;
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.2);
        }
        .icono-juego { font-size: 40px; }
        .info-juego h3 { margin: 0 0 5px 0; color: #1e90ff; }
        .info-juego p { margin: 0; color: #747d8c; font-size: 14px; }
        .bloqueado { opacity: 0.5; cursor: not-allowed; }

        /* --- PANTALLA JUEGO --- */
        .cabecera-juego {
            display: flex;
            justify-content: space-between;
            background: #f1f2f6;
            padding: 10px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .marcador-nivel { color: #ff9f43; }
        .marcador-puntos { color: #2ed573; }
        
        .monstruo { font-size: 85px; margin: 10px 0; transition: transform 0.2s; }
        .nombre-monstruo { font-size: 16px; color: #a4b0be; font-style: italic; margin-bottom: 15px; }
        
        .caja-pregunta { font-size: 46px; font-weight: bold; background-color: #2f3542; color: white; padding: 15px; border-radius: 20px; margin-bottom: 20px; }
        .opciones-verticales { display: flex; flex-direction: column; gap: 12px; }
        .mensaje-feedback { font-size: 18px; font-weight: bold; margin-top: 15px; min-height: 25px; }
        .racha-fuego { color: #ff4757; font-size: 18px; margin-top: 5px; font-weight: bold; }
        
        /* Vitrina de Medallas */
        .zona-progreso { margin-top: 20px; background: #f1f2f6; padding: 10px; border-radius: 15px; }
        .medallas-contenedor { display: flex; justify-content: center; gap: 10px; font-size: 30px; min-height: 35px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        
        <div id="pantalla-menu-mates">
            <button class="btn-volver" onclick="volverAlMapa()">🔙 Mapa Principal</button>
            <h1>🔢 Laboratorio de Mates 🧮</h1>
            <p class="subtitulo">¡Elige tu misión matemática!</p>

            <div class="zona-progreso">
                <strong>Tu Progreso Guardado:</strong>
                <div>Puntos Totales: <span id="menu-puntos-totales">0</span> ⭐</div>
                <div class="medallas-contenedor" id="menu-medallas"></div>
            </div>
            <br>

            <div class="lista-juegos">
                <div class="tarjeta-juego" onclick="comenzarMonstruo()">
                    <div class="icono-juego">👾</div>
                    <div class="info-juego">
                        <h3>El Monstruo Evolutivo</h3>
                        <p>¡Sube de nivel al monstruo acertando las tablas!</p>
                    </div>
                </div>

                <div class="tarjeta-juego bloqueado" onclick="alert('¡Pronto programaremos este juego aquí dentro!')">
                    <div class="icono-juego">⏰</div>
                    <div class="info-juego">
                        <h3>El Reloj Mágico</h3>
                        <p>¡Controla las horas del día! (Próximamente)</p>
                    </div>
                </div>
            </div>

            <button class="btn-borrar" onclick="reiniciarProgreso()">🗑️ Reiniciar todo el progreso</button>
        </div>

        <div id="pantalla-juego-monstruo" class="oculto">
            <button class="btn-volver" onclick="volverAlMenuMates()">🔙 Cambiar de Juego</button>
            
            <div class="cabecera-juego">
                <span class="marcador-nivel">Nivel: <span id="txt-nivel">1</span> / 3</span>
                <span class="marcador-puntos">Puntos: <span id="txt-puntos">0</span> ⭐</span>
            </div>

            <div class="monstruo" id="monstruo-emoji">👶</div>
            <div class="nombre-monstruo" id="monstruo-nombre">Monstruito Bebé</div>
            
            <div class="caja-pregunta" id="pregunta-texto">0 x 0</div>
            
            <div class="opciones-verticales">
                <button class="btn" id="btn-opc0" onclick="verificarRespuesta(0)">?</button>
                <button class="btn" id="btn-opc1" onclick="verificarRespuesta(1)">?</button>
                <button class="btn" id="btn-opc2" onclick="verificarRespuesta(2)">?</button>
            </div>
            
            <div class="mensaje-feedback" id="feedback-texto"></div>
            <div class="racha-fuego" id="racha-texto"></div>
        </div>

    </div>

    <script>
        function volverAlMapa() { window.location.href = "menuprincipal.html"; }
        
        /* --- VARIABLES GLOBALES DEL PROGRESO --- */
        let puntosTotales = 0;
        let medallasGanas = [];

        // Variables de la partida actual del monstruo
        let rachaAciertos = 0;
        let nivelActual = 1;
        let solucionCorrecta = 0;

        const datosNiveles = {
            1: { emoji: "👶", nombre: "Monstruito Bebé (Tablas: 2, 3, 4)" },
            2: { emoji: "🦖", nombre: "Monstruo Guerrero (Tablas: 5, 6, 7)" },
            3: { emoji: "👑", nombre: "Rey Monstruo Sabio (Tablas: 8, 9)" }
        };

        // --- SISTEMA LOCALSTORAGE: CARGAR Y GUARDAR ---
        function cargarProgreso() {
            const puntosGuardados = localStorage.getItem('mates_puntos');
            const medallasGuardadas = localStorage.getItem('mates_medallas');

            if (puntosGuardados !== null) {
                puntosTotales = parseInt(puntosGuardados);
            }
            if (medallasGuardadas !== null) {
                medallasGanas = JSON.parse(medallasGuardadas);
            }

            // Actualizar textos del menú inicial
            document.getElementById('menu-puntos-totales').innerText = puntosTotales;
            actualizarVitrinaVisual();
        }

        function guardarProgreso() {
            localStorage.setItem('mates_puntos', puntosTotales);
            localStorage.setItem('mates_medallas', JSON.stringify(medallasGanas));
            document.getElementById('menu-puntos-totales').innerText = puntosTotales;
            actualizarVitrinaVisual();
        }

        function actualizarVitrinaVisual() {
            const contenedorMenu = document.getElementById('menu-medallas');
            contenedorMenu.innerHTML = "";
            medallasGanas.forEach(medalla => {
                contenedorMenu.innerHTML += `<span>${medalla}</span>`;
            });
        }

        function reiniciarProgreso() {
            if(confirm("¿Seguro que quieres borrar los puntos de tu hermana y empezar de cero?")) {
                localStorage.clear();
                puntosTotales = 0;
                medallasGanas = [];
                cargarProgreso();
            }
        }

        /* --- LÓGICA DEL JUEGO DEL MONSTRUO --- */
        function comenzarMonstruo() {
            rachaAciertos = 0; 
            nivelActual = 1;
            document.getElementById('txt-puntos').innerText = puntosTotales;
            document.getElementById('txt-nivel').innerText = nivelActual;
            actualizarVisualMonstruo("😋");
            
            document.getElementById('pantalla-menu-mates').classList.add('oculto');
            document.getElementById('pantalla-juego-monstruo').classList.remove('oculto');
            generarPreguntaPorNivel();
        }

        function volverAlMenuMates() {
            document.getElementById('pantalla-juego-monstruo').classList.add('oculto');
            document.getElementById('pantalla-menu-mates').classList.remove('oculto');
        }

        function actualizarVisualMonstruo(emojiAccion) {
            const mEmoji = document.getElementById('monstruo-emoji');
            const mNombre = document.getElementById('monstruo-nombre');
            mEmoji.innerText = emojiAccion || datosNiveles[nivelActual].emoji;
            mNombre.innerText = datosNiveles[nivelActual].nombre;
        }

        function generarPreguntaPorNivel() {
            let tablasDisponibles = (nivelActual === 1) ? [2, 3, 4] : (nivelActual === 2) ? [5, 6, 7] : [8, 9];
            const tabla = tablasDisponibles[Math.floor(Math.random() * tablasDisponibles.length)];
            const numero = Math.floor(Math.random() * 10) + 1; 
            
            solucionCorrecta = tabla * numero;
            document.getElementById('pregunta-texto').innerText = `${tabla} x ${numero}`;

            let f1 = solucionCorrecta + (Math.random() > 0.5 ? 2 : -2);
            let f2 = solucionCorrecta + (Math.random() > 0.5 ? 5 : -5);
            if (f1 === solucionCorrecta) f1 += 3;
            if (f2 === solucionCorrecta || f2 === f1) f2 += 4;

            let opciones = [solucionCorrecta, Math.abs(f1), Math.abs(f2)].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 3; i++) {
                const b = document.getElementById(`btn-opc${i}`);
                b.innerText = opciones[i];
                b.disabled = false;
            }
        }

        function verificarRespuesta(indice) {
            const elegido = parseInt(document.getElementById(`btn-opc${indice}`).innerText);
            const feedback = document.getElementById('feedback-texto');
            const rachaTxt = document.getElementById('racha-texto');

            if (elegido === solucionCorrecta) {
                puntosTotales += 10; // Suma al progreso global
                rachaAciertos++;
                document.getElementById('txt-puntos').innerText = puntosTotales;
                
                feedback.innerText = "🎉 ¡Ñam! ¡Comida correcta! 🎉";
                feedback.style.color = "#2ed573";
                actualizarVisualMonstruo("🥳");
                
                if(rachaAciertos >= 3) rachaTxt.innerText = `🔥 ¡Racha de ${rachaAciertos} aciertos! 🔥`;

                bloquearBotones(true);
                comprobarSubidaNivel();
                comprobarMedallas();
                guardarProgreso(); // Guarda automáticamente en LocalStorage

                setTimeout(() => {
                    feedback.innerText = "";
                    actualizarVisualMonstruo(null);
                    generarPreguntaPorNivel();
                }, 1500);

            } else {
                rachaAciertos = 0;
                rachaTxt.innerText = "";
                feedback.innerText = "❌ ¡Oh no! Le dolió la tripa. ¡Inténtalo de nuevo! 💪";
                feedback.style.color = "#ff4757";
                actualizarVisualMonstruo("🥺");
                
                if(nivelActual > 1) {
                    nivelActual--;
                    document.getElementById('txt-nivel').innerText = nivelActual;
                }
                setTimeout(() => { actualizarVisualMonstruo(null); }, 1500);
            }
        }

        function comprobarSubidaNivel() {
            if (rachaAciertos === 4 && nivelActual === 1) {
                nivelActual = 2;
                setTimeout(() => { alert("🚀 ¡SÚPER EVOLUCIÓN! El monstruito creció."); }, 200);
            } else if (rachaAciertos === 8 && nivelActual === 2) {
                nivelActual = 3;
                setTimeout(() => { alert("👑 ¡EVOLUCIÓN MÁXIMA! Has desbloqueado al Rey Monstruo."); }, 200);
            }
            document.getElementById('txt-nivel').innerText = nivelActual;
        }

        function comprobarMedallas() {
            if (puntosTotales >= 50 && !medallasGanas.includes("🥉")) {
                medallasGanas.push("🥉");
                alert("🥉 ¡Felicidades! Has guardado tu primera Medalla de Bronce (50 pts).");
            }
            if (puntosTotales >= 150 && !medallasGanas.includes("🥈")) {
                medallasGanas.push("🥈");
                alert("🥈 ¡Increíble! Medalla de Plata guardada (150 pts).");
            }
            if (puntosTotales >= 300 && !medallasGanas.includes("🥇")) {
                medallasGanas.push("🥇");
                alert("👑 ¡Eres una experta! Medalla de Oro Máxima guardada (300 pts).");
            }
        }

        function bloquearBotones(estado) {
            for (let i = 0; i < 3; i++) document.getElementById(`btn-opc${i}`).disabled = estado;
        }

        // Ejecutar al cargar la página por primera vez
        cargarProgreso();
    </script>
</body>
</html>
